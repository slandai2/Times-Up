<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="setTime">
        <button><a href="index.html">Go Back</a></button>

        <div class="timerWindow">
            <h2>How Long Will You Play?</h2>

            <div class="timerInput">
                <div class="hours">
                    <h1>H</h1>
                    <div class="scroll">
                        <button class="increaseHour">+</button>
                        <p class="hNumber">0</p>
                        <button class="decreaseHour">-</button>
                    </div>
                </div>

                <div class="minutes">
                    <h1>M</h1>
                    <div class="scroll">
                        <button class="increaseMinute">+</button>
                        <p class="mNumber">0</p>
                        <button class="decreaseMinute">-</button>
                    </div>
                </div>

                <div class="seconds">
                    <h1>S</h1>
                    <div class="scroll">
                        <button class="increaseSecond">+</button>
                        <p class="sNumber">0</p>
                        <button class="decreaseSecond">-</button>
                    </div>
                </div>
            </div>

            <button>CONFIRM</button>
        </div>
    </div>
</body>
<script src=script.js></script>
</html>
